# Leaf's PulseAudio daemon settings for the MLP1. The session points
# PULSE_CONFIG here, which replaces /etc/pulse/daemon.conf outright, so the
# stock file is read first and only what Leaf changes follows it.
.include /etc/pulse/daemon.conf

# The kernel SIGKILLs a realtime thread that runs this long without blocking,
# with no log line anywhere. PulseAudio's 200 ms default is too tight here.
# Opening the rk817 PCM busy-waits about 150 ms in the kernel, and refilling
# the 2 s timer-scheduled buffer for a resampled stream (this build only has the
# slow ffmpeg resampler) takes about 80 ms of CPU at full clock, 375 ms at the
# sleep profile's 408 MHz and over 200 ms at Battery Saver's 600 MHz. Those
# refills killed the daemon on wake and under Battery Saver. One second covers
# the slowest measured refill with room to spare and still stops a wedged IO
# thread.
rlimit-rttime = 1000000
